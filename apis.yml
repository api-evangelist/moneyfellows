name: Moneyfellows
description: 'Money Fellows is an Egyptian fintech, founded in 2018 and regulated by
  the Central Bank of Egypt, that digitizes the traditional rotating savings and credit
  association (ROSCA / "gam''eya") model as a mobile app. Members join Money Circles
  to save together and access interest-free funds on flexible 6, 10, or 12-month plans
  of up to 1.2M EGP, and can spend and save through a prepaid Money Fellows Mastercard.
  The service is Sharia-compliant (Official Fatwa No. 46205 from the Egyptian Dar Al
  Iftaa) and has served millions of users while raising roughly $60M across its funding
  rounds, including a 2025 Series B first close backed by investors such as Partech.
  Money Fellows is a consumer mobile application and does not publish a public developer
  API, developer portal, or programmatic integration surface.'
